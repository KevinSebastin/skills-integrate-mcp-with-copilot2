<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="admin-container">
        <h3>Admin Activity Management</h3>
        <p class="section-description">
          Create, update, or delete activities without changing startup data.
        </p>
        <form id="admin-form">
          <input type="hidden" id="editing-activity-name" />
          <div class="form-group">
            <label for="admin-title">Activity Title:</label>
            <input type="text" id="admin-title" required placeholder="e.g. Robotics Club" />
          </div>
          <div class="form-group">
            <label for="admin-description">Description:</label>
            <textarea
              id="admin-description"
              required
              placeholder="Describe the activity"
            ></textarea>
          </div>
          <div class="form-group">
            <label for="admin-schedule">Schedule / Date:</label>
            <input type="text" id="admin-schedule" required placeholder="e.g. Wednesdays, 3:30 PM - 5:00 PM" />
          </div>
          <div class="form-group">
            <label for="admin-capacity">Capacity:</label>
            <input type="number" id="admin-capacity" min="1" required placeholder="20" />
          </div>
          <div class="form-actions">
            <button type="submit" id="admin-submit">Create Activity</button>
            <button type="button" id="admin-cancel" class="secondary-btn hidden">
              Cancel Edit
            </button>
          </div>
        </form>
        <div id="admin-message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
