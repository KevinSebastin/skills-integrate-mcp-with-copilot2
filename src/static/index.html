<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <section id="auth-container">
      <h3>Account Access</h3>
      <p class="helper-text">
        Demo logins: admin@mergington.edu / adminpass or
        michael@mergington.edu / memberpass
      </p>
      <form id="login-form">
        <div id="login-panel">
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input
              type="email"
              id="login-email"
              required
              placeholder="your-email@mergington.edu"
            />
          </div>
          <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required />
          </div>
          <button type="submit">Log In</button>
        </div>
      </form>
      <div id="auth-status" class="hidden auth-status">
        <p>Signed in as <strong id="auth-user"></strong></p>
        <button type="button" id="logout-button" class="secondary-btn">Log Out</button>
      </div>
      <div id="message" class="message hidden"></div>
    </section>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </section>

      <section id="admin-container" class="hidden">
        <h3 id="admin-form-title">Manage Activities</h3>
        <form id="admin-form">
          <div class="form-group">
            <label for="admin-name">Activity Name:</label>
            <input type="text" id="admin-name" required />
          </div>
          <div class="form-group">
            <label for="admin-description">Description:</label>
            <input type="text" id="admin-description" required />
          </div>
          <div class="form-group">
            <label for="admin-schedule">Schedule:</label>
            <input type="text" id="admin-schedule" required />
          </div>
          <div class="form-group">
            <label for="admin-max-participants">Max Participants:</label>
            <input type="number" id="admin-max-participants" min="1" required />
          </div>
          <div class="card-actions">
            <button type="submit">Save Activity</button>
            <button type="button" id="cancel-edit" class="secondary-btn hidden">
              Cancel Edit
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
